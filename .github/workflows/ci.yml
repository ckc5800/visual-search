name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # CI는 모델 다운로드 없이 순수 로직만 검증한다.
      # torch는 CPU 휠로 설치 (기본 인덱스는 CUDA 포함이라 무겁다)
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest
      - name: 진입점 임포트 확인
        run: python -c "import sys; sys.path.insert(0,'src'); import config, models, vectorstore, ingest, search, evaluate, api"
        env:
          PYTHONUTF8: "1"
      - run: pytest -q tests
        env:
          PYTHONUTF8: "1"
