<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>visual-search — 한국어 상품 검색</title>
<style>
  /* ── 디자인 토큰: 색·간격·모양은 여기서만 바꾼다 ─────────────────── */
  :root {
    color-scheme: light dark;
    --accent: #3b6ef6;
    --accent-text: #fff;
    --border: color-mix(in srgb, canvastext 12%, transparent);
    --border-strong: color-mix(in srgb, canvastext 25%, transparent);
    --chip-bg: color-mix(in srgb, canvastext 8%, transparent);
    --skeleton: color-mix(in srgb, canvastext 10%, transparent);
    --muted: .65;
    --radius: 10px;
    --radius-card: 12px;
    --gap: 14px;
    --card-min: 150px;
    --font: 'Segoe UI', 'Malgun Gothic', sans-serif;
    --fs-title: 1.3rem; --fs-input: 1.05rem; --fs-small: .85rem;
    --fs-chip: .8rem; --fs-card: .78rem;
    --page-max: 1100px;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font); margin: 0 auto; padding: 24px;
         background: canvas; color: canvastext; max-width: var(--page-max); }

  /* ── 레이아웃 컴포넌트 ──────────────────────────────────────────── */
  h1 { font-size: var(--fs-title); margin: 0 0 4px; }
  .sub { opacity: var(--muted); font-size: var(--fs-small); margin-bottom: 16px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row input[type=text] { flex: 1; font-size: var(--fs-input); padding: 10px 14px;
                          border-radius: var(--radius); border: 1px solid var(--border-strong);
                          background: canvas; color: canvastext; }
  .row button { font-size: 1rem; padding: 10px 18px; border-radius: var(--radius);
                border: none; background: var(--accent); color: var(--accent-text);
                cursor: pointer; }
  .toggle { font-size: var(--fs-small); display: block; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chips span { font-size: var(--fs-chip); padding: 4px 10px; border-radius: 999px;
                cursor: pointer; background: var(--chip-bg); }
  .status { font-size: var(--fs-small); opacity: .7; min-height: 1.2em; margin-bottom: 10px; }
  .hidden { display: none !important; }

  /* ── 결과 그리드 · 카드 ─────────────────────────────────────────── */
  .grid { display: grid; gap: var(--gap);
          grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr)); }
  .card { border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; cursor: pointer;
              background: var(--skeleton); }
  .card .info { padding: 8px 10px; font-size: var(--fs-card); line-height: 1.35; }
  .card .name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; min-height: 2.7em; }
  .card .meta { opacity: .6; }
  .card .score { float: right; opacity: .5; }

  /* ── 로딩 상태: 스켈레톤이 즉시 떠서 체감 TTFB를 줄인다 ───────────── */
  .card.skeleton .ph { background: var(--skeleton); border-radius: 4px;
                       animation: pulse 1.2s ease-in-out infinite; }
  .card.skeleton .ph-img { aspect-ratio: 3/4; border-radius: 0; }
  .card.skeleton .ph-line { height: .9em; margin: 8px 10px; }
  .card.skeleton .ph-line.short { width: 55%; margin-top: 4px; }
  @keyframes pulse { 50% { opacity: .45; } }
</style>
</head>
<body>
  <h1>visual-search</h1>
  <div class="sub">한국어 문장형 질의로 상품 44,072개를 검색합니다. 이미지를 클릭하면 비슷한 상품을 찾아요.</div>
  <form id="f" class="row">
    <input type="text" id="q" placeholder="예: 체크무늬 네이비 남성 셔츠" autofocus>
    <button>검색</button>
  </form>
  <label class="toggle">
    <input type="checkbox" id="hybrid" checked>
    하이브리드: 질의에서 색·성별·용도를 추출해 메타 필터로 결합
  </label>
  <div class="chips" id="chips"></div>
  <form id="rf" class="row hidden">
    <input type="text" id="followup" placeholder='이어서 조건 바꾸기 — 예: "좀 더 캐주얼하게", "네이비 말고 검정색으로"'>
    <button>정교화</button>
  </form>
  <div class="chips hidden" id="rchips"></div>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
<script>
const EXAMPLES = ["체크무늬 네이비 남성 셔츠", "여름용 캐주얼 원피스", "실버 여성 손목시계",
                  "검정 남성 정장 구두", "스포츠용 백팩", "골드 귀걸이"];
const REFINE_EXAMPLES = ["좀 더 캐주얼하게", "검정색으로", "여성용으로", "네이비 말고 초록색"];
const SKELETON_N = 12;
const $ = id => document.getElementById(id);
let cur = null;  // {q, filters} — 정교화용 병합 상태 (서버는 무상태)

function chip(parent, text, onclick) {
  const s = document.createElement("span");
  s.textContent = text;
  s.onclick = onclick;
  parent.appendChild(s);
}
EXAMPLES.forEach(t => chip($("chips"), t, () => { $("q").value = t; run(searchUrl(t)); }));
REFINE_EXAMPLES.forEach(t => chip($("rchips"), t, () => refineRun(t)));

const searchUrl = q =>
  `/api/search?q=${encodeURIComponent(q)}&hybrid=${$("hybrid").checked}`;

function refineRun(followup) {
  if (!cur) return;
  run(`/api/refine?q=${encodeURIComponent(cur.q)}&followup=${encodeURIComponent(followup)}` +
      `&filters=${encodeURIComponent(JSON.stringify(cur.filters))}`);
}

$("f").onsubmit = e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (q) run(searchUrl(q));
};
$("rf").onsubmit = e => {
  e.preventDefault();
  const t = $("followup").value.trim();
  if (t) { refineRun(t); $("followup").value = ""; }
};

function showSkeleton() {
  $("grid").innerHTML = Array.from({ length: SKELETON_N }, () => `
    <div class="card skeleton">
      <div class="ph ph-img"></div>
      <div class="ph ph-line"></div>
      <div class="ph ph-line short"></div>
    </div>`).join("");
}

function card(it) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <img src="/image/${it.pos}" loading="lazy" alt="">
    <div class="info">
      <div class="name">${it.productDisplayName ?? "(이름 없음)"}</div>
      <div class="meta">${[it.articleType, it.baseColour, it.gender].filter(Boolean).join(" · ")}
        <span class="score">${it.score.toFixed(3)}</span></div>
    </div>`;
  el.querySelector("img").onclick = () => run(`/api/similar?pos=${it.pos}`);
  return el;
}

async function run(url) {
  $("status").textContent = "검색 중…";
  showSkeleton();
  const t0 = performance.now();
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const ms = Math.round(performance.now() - t0);
    const head = data.anchor
      ? `"${data.anchor.productDisplayName}"와 비슷한 상품`
      : `"${data.query}" 검색 결과`;
    const f = data.filters && Object.keys(data.filters).length
      ? ` · 필터 ${Object.entries(data.filters).map(([k, v]) => `${k}=${v.join("|")}`).join(", ")}`
      : "";
    const t = data.timing
      ? ` (임베딩 ${data.timing.embed_ms} + 랭킹 ${data.timing.rank_ms}ms)`
      : "";
    $("status").textContent =
      `${head} — top ${data.items.length}, ${ms}ms${t}, model=${data.model}${f}`;
    $("grid").replaceChildren(...data.items.map(card));
    if (!data.anchor) {  // 텍스트 검색/정교화 결과만 정교화 상태로 저장
      cur = { q: data.query, filters: data.filters || {} };
      $("rf").classList.remove("hidden");
      $("rchips").classList.remove("hidden");
    }
  } catch (err) {
    $("status").textContent = `오류: ${err.message}`;
    $("grid").innerHTML = "";
  }
}
</script>
</body>
</html>
