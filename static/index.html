<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>visual-search — 한국어 상품 검색</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; margin: 0; padding: 24px;
         background: canvas; color: canvastext; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { opacity: .65; font-size: .85rem; margin-bottom: 16px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text] { flex: 1; font-size: 1.05rem; padding: 10px 14px; border-radius: 10px;
                     border: 1px solid color-mix(in srgb, canvastext 25%, transparent); }
  button { font-size: 1rem; padding: 10px 18px; border-radius: 10px; border: none;
           background: #3b6ef6; color: #fff; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .chips span { font-size: .8rem; padding: 4px 10px; border-radius: 999px; cursor: pointer;
                background: color-mix(in srgb, canvastext 8%, transparent); }
  #status { font-size: .85rem; opacity: .7; min-height: 1.2em; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { border: 1px solid color-mix(in srgb, canvastext 12%, transparent); border-radius: 12px;
          overflow: hidden; }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; cursor: pointer; }
  .card .info { padding: 8px 10px; font-size: .78rem; line-height: 1.35; }
  .card .name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; min-height: 2.7em; }
  .card .meta { opacity: .6; }
  .card .score { float: right; opacity: .5; }
</style>
</head>
<body>
  <h1>visual-search</h1>
  <div class="sub">한국어 문장형 질의로 상품 44,072개를 검색합니다. 이미지를 클릭하면 비슷한 상품을 찾아요.</div>
  <form id="f">
    <input type="text" id="q" placeholder="예: 체크무늬 네이비 남성 셔츠" autofocus>
    <button>검색</button>
  </form>
  <label style="font-size:.85rem; display:block; margin-bottom:8px">
    <input type="checkbox" id="hybrid" checked>
    하이브리드: 질의에서 색·성별·용도를 추출해 메타 필터로 결합
  </label>
  <div class="chips" id="chips"></div>
  <div id="status"></div>
  <div class="grid" id="grid"></div>
<script>
const EXAMPLES = ["체크무늬 네이비 남성 셔츠", "여름용 캐주얼 원피스", "실버 여성 손목시계",
                  "검정 남성 정장 구두", "스포츠용 백팩", "골드 귀걸이"];
const $ = id => document.getElementById(id);

const searchUrl = q =>
  `/api/search?q=${encodeURIComponent(q)}&hybrid=${$("hybrid").checked}`;

EXAMPLES.forEach(t => {
  const s = document.createElement("span");
  s.textContent = t;
  s.onclick = () => { $("q").value = t; run(searchUrl(t)); };
  $("chips").appendChild(s);
});

$("f").onsubmit = e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (q) run(searchUrl(q));
};

async function run(url) {
  $("status").textContent = "검색 중…";
  $("grid").innerHTML = "";
  const t0 = performance.now();
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const ms = Math.round(performance.now() - t0);
    const head = data.anchor
      ? `"${data.anchor.productDisplayName}"와 비슷한 상품`
      : `"${data.query}" 검색 결과`;
    const f = data.filters && Object.keys(data.filters).length
      ? ` · 필터 ${Object.entries(data.filters).map(([k, v]) => `${k}=${v.join("|")}`).join(", ")}`
      : "";
    $("status").textContent = `${head} — top ${data.items.length}, ${ms}ms, model=${data.model}${f}`;
    for (const it of data.items) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="/image/${it.pos}" loading="lazy" alt="">
        <div class="info">
          <div class="name">${it.productDisplayName ?? "(이름 없음)"}</div>
          <div class="meta">${[it.articleType, it.baseColour, it.gender].filter(Boolean).join(" · ")}
            <span class="score">${it.score.toFixed(3)}</span></div>
        </div>`;
      card.querySelector("img").onclick = () => run(`/api/similar?pos=${it.pos}`);
      $("grid").appendChild(card);
    }
  } catch (err) {
    $("status").textContent = `오류: ${err.message}`;
  }
}
</script>
</body>
</html>
